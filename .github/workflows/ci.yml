name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Release build
        run: npm run build

      - name: Headless acceptance workflow
        run: bash scripts/acceptance.sh
        # The Kopie binary links AppKit, which blocks on headless CI runners.
        # Acceptance tests require a real macOS GUI session; run locally via
        # `bash scripts/acceptance.sh` instead.
        continue-on-error: true
        timeout-minutes: 5